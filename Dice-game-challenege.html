<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff6600" id="theme-color">

    <title>The Dice Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />
    <link rel="stylesheet" href="game.css" />

  <body>
    
      
    <main class="main-section">
      <h1 class="heading">Dice Challenge 😁</h1>

          <img src="images/dice1.png" alt="dice" class="dice1" />

        <div class="player player-2">

          <img src="images/dice1.png" alt="dice" class="dice2" />

      </div>
      <button class="toss-button" onclick="window.location.reload();">Toss

      </button>
    
    </main>
    <footer class="footer">Dice challenge game</footer>
    <script src="script.js"></script>
